# Configuración de la aplicación
spring.application.name=vacaciones_db
app.frontend-url=${FRONTEND_URL}
app.base-url=${BASE_URL}
app.reset-password-url=${RESET_PASSWORD_URL}
app.reset-password-requires-change-url=${RESET_PASSWORD_REQUIRES_CHANGE_URL}

# Configuración de la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración de correo electrónico
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuración de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-reset-password=${JWT_EXPIRATION_RESET_PASSWORD}
jwt.expiration-login=${JWT_EXPIRATION_LOGIN}

# Configuración de Google Drive
google.drive.credentials.path=${GOOGLE_DRIVE_CREDENTIALS_PATH}
google.drive.folder.root=${GOOGLE_DRIVE_FOLDER_ROOT}

# Configuración del servidor
server.port=${PORT}
server.servlet.context-path=${CONTEXT_PATH}

# Configuración de seguridad
spring.security.user.name=${SECURITY_USERNAME}
spring.security.user.password=${SECURITY_PASSWORD}

# Configuración de logging
logging.level.root=${LOG_LEVEL}
logging.level.bootcamp.vacaciones=${APP_LOG_LEVEL}

# Configuración de caché
spring.cache.type=${CACHE_TYPE}
spring.cache.caffeine.spec=${CAFFEINE_SPEC}

# Configuración de rate limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE}

# Configuración de CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}

# Configuración adicional
spring.main.allow-circular-references=true


